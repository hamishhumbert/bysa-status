name: Workflow Security

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-security.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-security.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify workflow policy
        run: node scripts/verify-workflow-security.mjs
