owner: hamishhumbert
repo: bysa-status
user-agent: hamishhumbert

# Keep short incidents in the permanent incident history.
skipDeleteIssues: true

# This public repository contains no secrets or private endpoints.
secrets: []

assignees:
  - hamishhumbert

sites:
  - name: BYSA Staging Web
    slug: bysa-staging-web
    url: https://bysa-staging-385106564279.australia-southeast1.run.app
    expectedStatusCodes:
      - 200
    maxResponseTime: 30000
    __dangerous__body_down_if_text_missing: "An agent-operated resale desk"
    tags:
      - priority-p3
      - staging

  - name: BYSA Staging Liveness
    slug: bysa-staging-liveness
    url: https://bysa-staging-385106564279.australia-southeast1.run.app/livez
    expectedStatusCodes:
      - 200
    maxResponseTime: 30000
    __dangerous__body_down_if_text_missing: "ok"
    tags:
      - priority-p3
      - staging

  - name: BYSA Staging Readiness
    slug: bysa-staging-readiness
    url: https://bysa-staging-385106564279.australia-southeast1.run.app/readyz
    expectedStatusCodes:
      - 200
    maxResponseTime: 30000
    __dangerous__body_down_if_text_missing: '"ready":true'
    tags:
      - priority-p3
      - staging

status-website:
  baseUrl: /bysa-status
  name: BYSA Status
  theme: night
  introTitle: "**BYSA service status**"
  introMessage: >-
    Founder-stage monitoring for BYSA's public staging service. Checks may be
    delayed by GitHub Actions and are not guaranteed P1 paging. See the
    [severity policy](https://github.com/hamishhumbert/bysa-status/blob/master/SEVERITY.md)
    for the current scope.
  navbar:
    - title: Status
      href: /bysa-status/
    - title: Incidents
      href: https://github.com/hamishhumbert/bysa-status/issues?q=is%3Aissue+label%3Astatus
    - title: Severity policy
      href: https://github.com/hamishhumbert/bysa-status/blob/master/SEVERITY.md
